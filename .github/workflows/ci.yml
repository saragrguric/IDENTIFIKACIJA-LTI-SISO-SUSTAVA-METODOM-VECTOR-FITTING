name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow:
    name: Dokumentacija, alati i numeričke provjere (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Sara works on Windows and Lovro on Linux (ADR-0006).
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; reference workflow pin
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
      # uv picks Python 3.12 from .python-version; check_project.py installs from uv.lock.
      - run: uv run --no-project python --version
      - run: uv run --no-project python tools/check_before_stop.py
